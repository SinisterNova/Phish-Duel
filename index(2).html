<div class="box"><div class="acc">$ whoami: ${ME?esc(ME):"guest"} ${ME?'<button id="lo" style="padding:2px 8px;font-size:12px">./logout</button>':'<button id="li" style="padding:2px 8px;font-size:12px">./sign-in</button>'}</div><div class="acc">$ ./phish_duel --help</div>
<button id="t">./train --emails=10 --explain</button> <span class="dim">// solo practice + explanations</span><br>
<button id="c">./duel --create</button> <span class="dim">// get a room code, race a friend</span><br>
<span><input id="j" placeholder="ROOM CODE" maxlength="5"><button id="jb">./duel --join</button> <span class="dim">// enter a friend's code</span></span>
<div class="dim" style="margin-top:8px">// preview the pvp pages with demo data</div><button id="pw">./preview --win</button><button id="pl">./preview --lose</button><button id="pr">./preview --race</button>
<div id="e" class="bad"></div>${db?"":'<div class="dim">multiplayer is off: PeerJS did not load (check your connection). training works offline.</div>'}</div>`;
 $("#t").onclick=()=>start("train",Math.floor(Math.random()*1e9));
 $("#c").onclick=()=>room($("#j").value,true);$("#jb").onclick=()=>room($("#j").value,false);$("#pw").onclick=()=>demo("win");$("#pl").onclick=()=>demo("lose");$("#pr").onclick=()=>demo("race");if($("#lo"))$("#lo").onclick=logout;if($("#li"))$("#li").onclick=()=>login();rain();typer()}
function room(code,create){
 if(!db){$("#e").textContent="multiplayer unavailable: PeerJS did not load (check your connection).";return}
 if(!ME){login();return}
 if(create)code=Array.from({length:5},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
 code=code.trim().toUpperCase();if(code.length!==5){$("#e").textContent="enter a 5-char code.";return}
 const nm=ME,init=()=>({name:nm,n:0,score:0,ms:0,done:false}),say=m=>{const e=$("#e");if(e)e.textContent=m};
 const begin=p=>{G={mode:"pvp",code,name:nm,peer:p,conn:null,col:{doc:()=>({set:d=>{if(G&&G.conn&&G.conn.open)G.conn.send(d);return Promise.resolve()}})}};G.unsub=()=>{try{p.destroy()}catch(e){}}};
 const data=d=>{if(!G)return;if(d==="full"){say("room is full.");G.unsub();G=null;return}if(!d||typeof d!=="object")return;
  G.opp={name:String(d.name||"?").slice(0,14),n:d.n|0,score:d.score|0,ms:+d.ms||0,done:!!d.done,started:!!d.started};
  if(G.view==="lobby")lobby();else if(G.view==="wait"||G.view==="play")side();if(G.view==="wait")result()};
 const link=c=>{G.conn=c;c.on("data",data);c.on("close",()=>{if(!G||G.conn!==c)return;
  if(G.view==="lobby"){G.opp=null;lobby()}
  else if(!(G.opp&&G.opp.done)&&!G.shown){clearInterval(TI);G.view="gone";A.innerHTML=`<h1>duel ${G.code}</h1><div class="box"><b class="bad">opponent disconnected.</b></div><button id="m">./menu</button>`;$("#m").onclick=()=>location.reload()}})};
 say("connecting...");
 const id="phishduel-"+code,p=create?new Peer(id):new Peer();
 p.on("error",e=>{const t=e.type;say(t==="peer-unavailable"?"room not found.":t==="unavailable-id"?"that code is taken, try again.":"connection error ("+t+")");if(t==="peer-unavailable"||t==="unavailable-id"){G=null;try{p.destroy()}catch(x){}}});
 if(create){p.on("open",()=>{begin(p);lobby()});
  p.on("connection",c=>{if(!G)return;if(G.conn&&G.conn.open){c.on("open",()=>{c.send("full");setTimeout(()=>c.close(),400)});return}link(c);c.on("open",()=>c.send(init()))})}
 else p.on("open",()=>{begin(p);const c=p.connect(id,{reliable:true});link(c);c.on("open",()=>{c.send(init());lobby()})})}
function lobby(){thm("duel");G.view="lobby";A.innerHTML=`<h1>room ${G.code}</h1><div class="box">share this code with your opponent.<br>
<span class="acc" style="font-size:28px;letter-spacing:6px">${G.code}</span><br><br>
${G.opp?`<span class="acc">${esc(String(G.opp.name))}</span> connected.<br><button id="s">&gt; start duel</button>`:'<span class="cur dim">waiting for opponent</span>'}
<br><span class="dim">both players get the same 10 emails. most correct wins, speed breaks ties.</span></div><button id="x">abort</button>`;
 if($("#s"))$("#s").onclick=async()=>{try{await G.col.doc(uid).set({name:G.name,n:0,score:0,ms:0,done:false,started:true})}catch(e){}start("pvp",hash(G.code))};$("#x").onclick=()=>location.reload();
 if(G.opp&&G.opp.started&&!G.started)start("pvp",hash(G.code))}
function start(mode,seed){thm(mode==="pvp"?"duel":"train");const g=G&&mode==="pvp"?G:{};Object.assign(g,{mode,order:deck(seed),i:0,score:0,streak:0,lock:0,log:[],ms:0,t0:Date.now(),view:"play",started:1});
 g.n=g.n||0;G=g;show()}
function show(){const e=E[G.order[G.i]];G.t0=Date.now();G.lock=0;
 const P=G.mode==="pvp";A.innerHTML=(P?'<div class="duel"><div class="main">':"")+`<h1>${P?"duel "+G.code:"training"}</h1>${P?'<div class="tm"><span id="tt">40.0s</span><div class="tbar"><i id="tf"></i></div></div>':""}
<div class="dim">email ${G.i+1}/10 | score ${G.score} | streak ${G.streak|0}</div>
<div class="bar" id="bar"><i id="bi" style="width:${Math.max(0,G.i-1)*10}%"></i></div>
<div class="dim">$ cat inbox/mail_${String(G.i+1).padStart(2,"0")}.eml <span class="acc">[${e[5]}]</span>${e[6]?' <span class="bad">[HARD]</span>':""}</div><div class="box mail"><div class="hd"><span class="dim">from:</span> ${esc(e[0])}\n<span class="dim">subj:</span> ${esc(e[1])}</div>${fmt(e[2])}</div>
<div id="a"><button id="l">[L] legit</button><button id="p" class="b">[P] phishing</button></div><div id="f"></div>`+(P?"</div>"+sideHtml()+"</div>":"");
 $("#l").onclick=()=>ans(0);$("#p").onclick=()=>ans(1);requestAnimationFrame(()=>requestAnimationFrame(side));tick();
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$("#bar"),bi=$("#bi");if(!b)return;bi.style.width=G.i*10+"%";if(G.i>0)b.classList.add("pulse")}))}
function ans(g){if(G.lock||G.view!=="play")return;if(G.mode==="pvp"&&used()>=LIM)return finish(1);G.lock=1;const e=E[G.order[G.i]],ok=g===e[3]?1:0;G.streak=ok?(G.streak|0)+1:0;G.log=(G.log||[]).concat({g:e[5],ok,ph:e[3],t:e[4]});G.ms+=Date.now()-G.t0;G.score+=ok;G.n=G.i+1;
 if(G.mode==="pvp")G.col.doc(uid).set({name:G.name,n:G.n,score:G.score,ms:G.ms,done:G.n>=10,started:true}).catch(()=>{});
 if(G.mode==="train"){$("#a").innerHTML="";$("#f").innerHTML=`<div class="box"><b class="${ok?"acc":"bad"}">${ok?"[OK] correct":"[FAIL] wrong"}</b> - this was ${e[3]?"PHISHING":"LEGIT"}.<br><span class="dim">${esc(e[4])}</span></div><button id="nx">next &gt;</button>`;$("#nx").onclick=()=>swap(next);$("#nx").focus();fx(ok)}
 else{fx(ok);setTimeout(()=>swap(next),750)}}
function next(){if(!G)return;G.i++;if(G.i<10)return show();
 if(G.mode==="train"){A.innerHTML=`<h1>training complete</h1><div class="box">score: <span class="acc">${G.score}/10</span><br><span class="dim">${G.score>=9?"sharp eyes.":G.score>=6?"decent, check sender domains and links.":"hover links, read domains letter by letter."}</span></div><button id="a1">train again</button><button id="a2">menu</button>`;
  $("#a1").onclick=()=>start("train",Math.floor(Math.random()*1e9));$("#a2").onclick=menu;return}
 G.view="wait";result()}
document.addEventListener("keydown",e=>{if(!G||G.view!=="play"||e.target.tagName==="INPUT")return;
 const k=e.key.toLowerCase();if(k==="l"&&$("#l"))ans(0);else if(k==="p"&&$("#p"))ans(1);else if((k==="enter"||k===" ")&&$("#nx"))swap(next)});
</script></body></html>
